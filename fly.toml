# Fly.io deployment (TECH-05). HTTPS is terminated by Fly's proxy.
app = "coderacer"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Versioned migrations (TECH-04) are applied before each release.
  release_command = "npx prisma migrate deploy"

[http_service]
  internal_port = 3000
  force_https = true
  # Rooms live in memory on a single machine: keep it running and never scale
  # out (see docs/ARCHITECTURE.md).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
