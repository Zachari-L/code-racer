# Local PostgreSQL for development and end-to-end tests.
# Start with `docker compose up -d`; the URL matches DATABASE_URL in .env.example.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coderacer
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coderacer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
