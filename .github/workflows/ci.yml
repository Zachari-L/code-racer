# TECH-09: every push runs lint, type checking and unit tests; integration and
# end-to-end tests run against a real PostgreSQL in a second job. A push to
# main that passes both is deployed to Fly.io.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push cancels the previous run of the same branch, except on main,
# where a run may be deploying.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # postinstall generates the Prisma client.
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun test

  e2e:
    name: Integration and end-to-end tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: coderacer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/coderacer?schema=public
      # Test-only secret; production secrets live in the host's secret store.
      AUTH_SECRET: ci-only-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx prisma migrate deploy
      # Realtime server, results and profile code against the empty database.
      - run: bun run test:integration
      # Corpus of passages for coherent texts, plus demo accounts.
      - run: bun run db:seed
      - run: bun run build
      - id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      # Cached browsers still need their system libraries.
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - run: bun run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://coderacer.fly.dev
    # Deploys run one at a time and are never cancelled halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      # Migrations run as the release command (fly.toml). Fly's Depot builder
      # has hung on uploads, so the image is built by Fly's own remote builder.
      - run: flyctl deploy --remote-only --depot=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Check that the site answers
        run: |
          for _ in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://coderacer.fly.dev/)
            [ "$status" = "200" ] && exit 0
            sleep 10
          done
          echo "https://coderacer.fly.dev/ answered $status" >&2
          exit 1
